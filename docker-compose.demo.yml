# Demo overlay: run the API/worker against the labelled DEMO database instead of the plain `mygovt` one.
#   docker compose -f docker-compose.yml -f docker-compose.demo.yml up -d --build
#   docker compose exec -T backend sh -c 'python -m scripts.demo_env --admin-dsn postgresql://$POSTGRES_USER:$POSTGRES_PASSWORD@postgres:5432/postgres'
# (or simply `make demo`). Demo data is synthetic and clearly labelled; see docs/demo.md. Never use this overlay for real data.
services:
  backend:
    environment:
      POSTGRES_DB: mygovt_dev_demo
      DEMO_INCLUDE_SYNTHETIC: "true"
      APP_ENV: development
      RATE_LIMIT_REGISTER_PER_HOUR: "200"
      RATE_LIMIT_LOGIN_PER_MIN: "200"
      RATE_LIMIT_CHAT_PER_MIN: "200"
  worker:
    environment:
      POSTGRES_DB: mygovt_dev_demo
